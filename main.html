<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>เราอยู่ด้วยกันมา</title>

  <!-- FONT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h1>เราอยู่ด้วยกันมา</h1>

    <div class="countdown">
      <div class="count-item">
        <span id="days">0</span>
        <small>วัน</small>
      </div>
      <div class="count-item">
        <span id="hours">0</span>
        <small>ชม.</small>
      </div>
      <div class="count-item">
        <span id="minutes">0</span>
        <small>นาที</small>
      </div>
      <div class="count-item">
        <span id="seconds">0</span>
        <small>วินาที</small>
      </div>
    </div>

    <p id="message">
      เค้าไม่เคยอยากให้ตัวเลขพวกนี้มันหยุดลงเลยนะ เราผ่านช่วงเวลานี้มาด้วยกัน เจออะไรมาด้วยกันก็เยอะ ไปเที่ยวด้วยกันมีความสุขด้วยกันเยอะไปหมดเลย
      เค้าอยากให้เราจับมือกันต่อไปอย่าพึ่งปล่อยมือกันเลยนะ
    </p>

    <button onclick="window.location.href='gallery.html'">
      NEXT
    </button>

  </div>

  <script src="script.js"></script>

</body>
</html>
