<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Note</title>

  <!-- FONT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container note-page">

    <h1>เค้ารักแก้มมากนะ</h1>

    <p>
      แก้มลองอ่านดูนะเค้าตั้งใจเขียนมากๆเลย
    </p>

    <div class="note-paper">
      <textarea id="noteText" placeholder="เค้าไม่รู้ว่าตอนนี้แก้มรู้สึกยังไงกับเค้านะ แต่ตอนนี้เค้าโครตรู้สึกแย่เลยถ้าเรื่องของเรามันจบแบบนี้เค้าอยากให้เราพัฒนาความสัมพันธ์กันไปต่อ
      ให้มันดีขึ้นกว่าตอนนี้ เค้าอยากให้เธอกลับมารักเค้า สนใจเค้าเหมือนเดิม เค้าลองมาคิดๆดูแล้วเธออาจจะไม่ได้เปลี่ยนไปเพราะตัวเธอเอง เค้าอาจจะเป็นคนที่ทำให้เธอต้องเปลี่ยนไป แต่ตอนนี้เค้าไม่อยากเสียเธอไป
      เค้าอยากให้เราลองกลับมาแก้ไข กลับมารักษารอยร้าวที่มันเกิดขึ้นแล้วอุดมันให้กลับมาสวยเหมือนใหม่ได้มั้ยคับ เค้าอยากให้เธอคิดถึงวันแรกๆที่คบกันที่เรารักกัน มันมีความสุขมากเลยนะ เค้านั่งทำเว็บนี้เค้าก็แอบร้องไห้
      เพราะเค้าเห็นแต่ภาพที่เรายิ้มกัน มีความสุขด้วยกันเต็มไปหมดเลย อยากให้แก้มของเค้ากลับมารักกันเหมือนเดิม แต่ถ้าแก้มคิดว่ามันไปต่อไม่ได้ก็ไม่เป็นอะไรนะ เค้าจะรับการตัดสินใจของเธอให้ได้ เธอไม่ต้องรีบตอบเค้าก็ได้
      แต่ถ้าเธอได้คำตอบ เธอตอบไว้นะช่องข้างล่างให้หน่อยนะ เดี๋ยวเค้าจะเข้ามาอ่านเองคับ แปะไว้กี่อันก็ได้ ขอบคุณนะที่อ่านมาถึงตรงนี้ 💗"></textarea>
      <div class="note-actions">
        <button id="saveNoteBtn" type="button">เพิ่มโน้ต</button>
      </div>
    </div>

    <div class="note-list-wrapper">
      <h2>เขียนแปะไว้ได้เลยนะ</h2>
      <div id="noteList" class="note-list"></div>
      <p id="noNotes" class="no-notes">...........</p>
    </div>

    <button onclick="window.history.back()">
      BACK
    </button>

    <button onclick="window.location.href='main.html'">
      ต่อไป
    </button>

  </div>

  <script src="script.js"></script>

</body>
</html>
