<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Message Note</title>

  <!-- FONT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container note-page">

    <h1>เค้ารักแก้มมากนะ</h1>

    <p>
      มีอะไรอยากบอกเขาเขียนไว้ด้านล่างได้เลย แล้วเดี๋ยวเขาจะมาอ่านเอง
    </p>

    <div class="note-input-panel">
      <h2>ส่ง note</h2>
      <textarea id="noteText" placeholder="พิมพ์ข้อความที่อยากส่งถึงเขาที่นี่..."></textarea>
      <div class="note-actions">
        <button id="saveNoteBtn" type="button">ส่ง note</button>
      </div>
    </div>

    <div class="note-paper">
      <h2>ข้อความที่แปะไว้</h2>
      <div id="noteList" class="note-list"></div>
      <p id="noNotes" class="no-notes">ยังไม่มีข้อความ</p>
    </div>

    <button onclick="window.history.back()">
      BACK
    </button>

  </div>

  <script src="script.js"></script>

</body>
</html>
